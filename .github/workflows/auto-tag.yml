name: Auto tag on merge

# Reads the latest SemVer version from CHANGELOG.md and, on every push to main
# (i.e. after a PR merge), creates and pushes the matching git tag if it does
# not already exist. Single source of truth: CHANGELOG.md.

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from CHANGELOG
        id: version
        run: |
          version=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
            | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$version" ]; then
            echo "::error::No SemVer version found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest CHANGELOG version: $version"

      - name: Create and push tag
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "Created and pushed $tag"
